# Render Blueprint - https://render.com/docs/blueprint-spec
services:
  - type: web
    name: avi-digital-twin
    runtime: python
    rootDir: digital_twin
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TWIN_NAME
        value: Avi Tsipshtein
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false   # secret - entered in the Render dashboard
      - key: PROFILE_KEY
        sync: false
      - key: PUSHOVER_USER
        sync: false
      - key: PUSHOVER_TOKEN
        sync: false
